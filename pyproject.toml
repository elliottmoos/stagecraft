[project]
name = "stagecraft"
version = "0.0.1"
description = "Author CI/CD pipelines as stages of blocks and compile them to Helm-compatible Argo Workflows templates."
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    # Hera is pinned exactly: its API and generated models change between releases.
    "hera==7.1.0",
    "pydantic>=2.14,<3",
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27,<1",
]

[project.scripts]
stagecraft = "stagecraft.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "syrupy>=6.1,<7",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Integration tests are opt-in: `uv run pytest -m integration` (the last -m wins).
addopts = ["--strict-markers", "-ra", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: needs a kind cluster with Argo Workflows installed (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# DESIGN.md carries the spec's authoring example verbatim.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Test helper packages importable through pytest's pythonpath = ["tests"].
known-local-folder = ["fixtures", "support"]
